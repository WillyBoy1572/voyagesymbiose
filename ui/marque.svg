<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Voyage">
  <!--
    Notre marque, dans le langage visuel du jeu : la tete du gardien, ses
    yeux cyan, son echarpe orange. Ce n'est pas le logo du studio — on ne
    redistribue pas leur dessin, on parle la meme langue.
    Angles vifs, aplats pleins, filet d'un pixel : comme l'interface du jeu.
  -->
  <rect x="1" y="1" width="62" height="62" fill="#0f110c" stroke="#ffffff" stroke-width="2" />

  <!-- L'echarpe, derriere la tete -->
  <path d="M16 48 h32 v6 h-32 z" fill="#d05a34" />
  <path d="M44 48 l8 12 h-7 l-5 -12 z" fill="#b4462400" />

  <!-- La tete -->
  <path d="M20 14 h24 a4 4 0 0 1 4 4 v22 a4 4 0 0 1 -4 4 h-24 a4 4 0 0 1 -4 -4 v-22 a4 4 0 0 1 4 -4 z" fill="#d9ddd6" />

  <!-- La visiere -->
  <rect x="20" y="20" width="24" height="14" fill="#14160f" />

  <!-- Les yeux -->
  <circle cx="27" cy="27" r="3.6" fill="#26acd8" />
  <circle cx="37" cy="27" r="3.6" fill="#26acd8" />

  <!-- L'antenne laterale -->
  <rect x="46" y="22" width="4" height="10" fill="#9aa096" />
</svg>
